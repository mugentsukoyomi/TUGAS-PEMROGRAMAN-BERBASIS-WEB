<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator sederhana</title>
    <link rel="Stylesheet" href="kalkulator-style.css">
</head>
<body>
    <form id="operasi-perhitungan">
        <label for="bilangan-pertama">Bilangan 1</label>
        <input type="number" id="bilangan-pertama" name="bilangan-pertama" placeholder="Masukkan angka pertama"> <br>
        <label for="bilangan-kedua">Bilangan 2</label>
        <input type="number" id="bilangan-kedua" name="bilangan-kedua" placeholder="Masukkan angka kedua"><br> <br>
        <input type="button" value="tambah" onclick="penjumlahan()">
        <input type="button" value="kurang" onclick="pengurangan()">
        <input type="button" value="kali" onclick="perkalian()">
        <input type="button" value="bagi" onclick="pembagian()">
        <input type="button" value="modulus" onclick="modulus()">
        <input type="button" value="reset" onclick="reset()">
        <div class="hasil">
            <label for="hasil">Hasil:</label>
            <output form="operasi-perhitungan" id="hasil"></output> 
        </div>
    </form>
    <script>
        function ambilNilai(){
            let a = document.getElementById("bilangan-pertama").value;
            let b = document.getElementById("bilangan-kedua").value;

            if(a == "" || b == ""){
               return  alert("Masukkan angka!");
            }
        }

        function reset(){ // fungsi untuk mereset atau memulai ulang
            return 0;
        }
        function tampilkanHasil(nilai){ // fungsi untuk mengambil dan menampilkan hasil perhitungan ke layar web
            document.getElementById("hasil").value = nilai;
        }
        function penjumlahan(){ 
            let angka = ambilNilai()
            if(angka != null){
               hasil = angka.a + angka.b;
               tampilkanHasil(hasil);
            }
        }
        function pengurangan(){
            let angka = ambilNilai()
            if(angka != null){
               hasil = angka.a - angka.b;
               tampilkanHasil(hasil);
            }
        }
        function perkalian(){
            let angka = ambilNilai()
            if(angka != null){
               hasil = angka.a * angka.b;
               tampilkanHasil(hasil);
            }
        } 
        function pembagian(){
            let angka = ambilNilai()
            if(angka != null){
               hasil = angka.a / angka.b;
               tampilkanHasil(hasil);
            }
        }
        function modulus(){
            let angka = ambilNilai()
            if(angka != null){
               hasil = angka.a % angka.b;
               tampilkanHasil(hasil);
            }
        }
    </script>
</body>
</html>
